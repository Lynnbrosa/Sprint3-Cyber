# imagem nginx-unprivileged: roda como uid 101, sem root, portas 8080/8443
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # ---- Hardening ----
    server_tokens off;
    client_max_body_size 1m;
    client_body_buffer_size 16k;
    large_client_header_buffers 4 8k;

    # Limites + timeouts (slowloris)
    keepalive_timeout 30s;
    send_timeout 30s;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Rate limiting nivel nginx (defesa adicional ao slowapi do app)
    limit_req_zone $binary_remote_addr zone=api_global:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=api_login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_llm:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=por_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # request id nasce aqui se o cliente nao mandou; a api valida o formato
    map $http_x_request_id $rid {
        ""      $request_id;
        default $http_x_request_id;
    }

    log_format json_combined escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,'
        '"http_user_agent":"$http_user_agent","request_id":"$rid",'
        '"ssl_protocol":"$ssl_protocol","limit_req":"$limit_req_status"}';
    access_log /var/log/nginx/json/access.log json_combined;

    # ---- HTTP -> HTTPS redirect ----
    server {
        listen 8080 default_server;
        server_name _;
        return 301 https://$host:8443$request_uri;
    }

    # ---- HTTPS terminator ----
    server {
        listen 8443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;

        # TLS hardening — Mozilla "intermediate".
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        limit_conn por_ip 30;

        # ---- Security headers ----
        # CSP fica no middleware do FastAPI (por rota); aqui geraria 2 CSPs e quebraria o Swagger
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

        # ---- Proxy comum ----
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # sobrescreve em vez de anexar ($proxy_add_x_forwarded_for): o XFF que o cliente
        # manda nao pode chegar na api, senao ele escolhe o proprio IP
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-Id      $rid;
        proxy_hide_header X-Powered-By;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;

        # metrica e interna: prometheus raspa direto na rede observability
        location = /metrics { return 404; }

        location = /health {
            proxy_pass http://api:8000/health;
            access_log off;
        }

        location = /v1/auth/login {
            limit_req zone=api_login burst=2 nodelay;
            proxy_pass http://api:8000$request_uri;
        }

        location /v1/llm-assist {
            limit_req zone=api_llm burst=3 nodelay;
            proxy_pass http://api:8000$request_uri;
        }

        location / {
            limit_req zone=api_global burst=20 nodelay;
            limit_except GET POST PATCH PUT DELETE OPTIONS { deny all; }
            proxy_pass http://api:8000$request_uri;
        }
    }
}
