<text x='24' y='330' font-size='11.5' text-anchor='start' font-weight='400' fill='#6b7280'>Automático hoje: lockout, reuso de refresh derruba a família, 429, recusa de telemetria e de handshake MQTT. Manual (runbook): bloqueio de IP, revogação de certificado, rotação de chave, comunicação LGPD.</text>
