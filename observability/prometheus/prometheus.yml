global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    ambiente: dev
    projeto: previopls

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    # o /metrics da api exige Bearer; o token chega como secret do compose, nunca no yml
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["api:8000"]
        labels: { componente: api }

  - job_name: ingestor
    static_configs:
      - targets: ["ingestor:9101"]
        labels: { componente: iot }

  - job_name: alert-sink
    static_configs:
      - targets: ["alert-sink:9102"]
        labels: { componente: resposta }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
