# pipeline DevSecOps do PrevioPLS (Ford Challenge, Sprint 3)
#
#   commit/PR ─┬─ 1 secrets (gitleaks, historico inteiro)
#              ├─ 2 sast    (semgrep + regras do projeto) e bandit
#              ├─ 3 sca     (pip-audit, dependency review no PR)
#              ├─ 4 iac     (hadolint, trivy config em Dockerfile/compose/k8s)
#              └─ 5 testes  (pytest contra postgres: authz, sessao, hmac, iot)
#                     │ tudo verde
#                     ▼
#              6 build + scan da imagem (trivy HIGH/CRITICAL, SBOM CycloneDX)
#                     ▼
#              7 dast (stack sobe no runner: ZAP baseline + testes negativos de MQTT)
#                     ▼ so na main
#              8 publica no GHCR por digest + assina com cosign (keyless)
#                     ▼ aprovacao manual (environment production)
#              9 deploy
#
# actions pinadas por SHA (tag e mutavel); o dependabot atualiza os SHAs.

name: DevSecOps

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # rotina semanal: segunda 06:00 UTC roda SCA + DAST mesmo sem commit (CVE nova aparece sem o codigo mudar)
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # o banco de CVE do trivy no ghcr.io devolve TOOMANYREQUESTS pra runner compartilhado; espelhos primeiro
  TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
  TRIVY_JAVA_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1

jobs:
  secrets:
    name: 1 · secret scanning (gitleaks)
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: gitleaks no historico inteiro
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo \
            --config /repo/.gitleaks.toml --redact --exit-code 1 \
            --report-format sarif --report-path /repo/gitleaks.sarif
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: always()
        continue-on-error: true # repo privado sem GHAS nao aceita SARIF
        with: { sarif_file: gitleaks.sarif, category: gitleaks }

  sast:
    name: 2 · SAST (semgrep)
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    container: { image: semgrep/semgrep:1.178.0 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: semgrep (regras OWASP + regras do projeto em .semgrep/)
        run: |
          semgrep scan --metrics=off --error --severity ERROR \
            --config p/python --config p/owasp-top-ten --config p/jwt --config p/secrets \
            --config .semgrep/ --sarif --output semgrep.sarif app/
      # o semgrep grava no SARIF ate o achado com nosemgrep (suppressions: inSource) e o github
      # abre alerta pra ele assim mesmo; a excecao ja esta justificada no codigo
      - name: tira do SARIF o que tem nosemgrep
        if: always()
        run: |
          [ -f semgrep.sarif ] || exit 0
          python3 - <<'EOF'
          import json
          d = json.load(open("semgrep.sarif"))
          for run in d["runs"]:
              run["results"] = [r for r in run["results"] if not r.get("suppressions")]
          json.dump(d, open("semgrep.sarif", "w"))
          EOF
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: always()
        continue-on-error: true
        with: { sarif_file: semgrep.sarif, category: semgrep }

  bandit:
    name: 2 · SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      # fora do container do semgrep: o python de la e "externally managed" (PEP 668) e recusa pip install
      - name: bandit (medio/alto quebra o build)
        run: |
          pip install --quiet "bandit[toml]==1.9.4"
          bandit -r app -c pyproject.toml --severity-level medium --confidence-level medium

  sca:
    name: 3 · SCA (pip-audit + dependency review)
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: pip-audit (qualquer CVE conhecida quebra o build)
        run: |
          pip install --quiet pip-audit==2.10.1
          # sem vulnerabilidade o pip-audit nao cria o arquivo de saida: o relatorio vai pelo stdout
          set -o pipefail
          pip-audit -r requirements.txt --strict --desc on | tee pip-audit.txt
          { echo '### pip-audit'; echo '```'; cat pip-audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: dependency review (so em PR, barra dependencia nova com CVE alta ou licenca proibida)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0
          comment-summary-in-pr: on-failure

  iac:
    name: 4 · IaC (hadolint + trivy config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with: { dockerfile: Dockerfile, failure-threshold: warning }
      - name: trivy config (Dockerfile, compose, kubernetes)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

  testes:
    name: 5 · testes de seguranca (pytest + postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: teste, POSTGRES_PASSWORD: teste, POSTGRES_DB: teste }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U teste" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://teste:teste@localhost:5432/teste
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          cache: pip
      - run: pip install -r requirements.txt pytest==9.1.1 pytest-cov==7.0.0 anyio
      - run: python -m pytest -q --cov=app --cov-report=term --junitxml=junit.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: junit, path: junit.xml }

  imagem:
    name: 6 · build + scan da imagem (trivy + SBOM)
    needs: [secrets, sast, bandit, sca, iac, testes]
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: previopls-security:ci
          provenance: false
      # gate e relatorio em passos separados: em SARIF o trivy-action ignora o filtro de
      # severidade, e gate misturado com relatorio quebrava por motivo que nao era CVE alta
      - name: trivy image (HIGH/CRITICAL com correcao disponivel quebra o build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: previopls-security:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: .trivyignore
      - name: trivy image (relatorio SARIF, nao barra)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: previopls-security:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: sarif
          output: trivy-image.sarif
          limit-severities-for-sarif: true
          skip-setup-trivy: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: always()
        continue-on-error: true
        with: { sarif_file: trivy-image.sarif, category: trivy-image }
      - name: SBOM CycloneDX
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: previopls-security:ci
          format: cyclonedx
          output: sbom.cdx.json
          skip-setup-trivy: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: sbom, path: sbom.cdx.json }

  dast:
    name: 7 · DAST (ZAP baseline + ataques MQTT)
    needs: [imagem]
    runs-on: ubuntu-latest
    permissions: { contents: read, issues: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: sobe a stack de teste
        run: |
          python3 scripts/bootstrap_env.py --quiet
          docker compose up -d --build --wait api nginx mosquitto ingestor
      - name: ZAP baseline na borda (https://localhost:8443)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://localhost:8443/health
          rules_file_name: .zap/rules.tsv
          # -I: aviso (WARN) nao quebra; so as regras marcadas FAIL em .zap/rules.tsv
          cmd_options: -a -j -I
          fail_action: true
          allow_issue_writing: false
      - name: controles de IoT tem que recusar (sem certificado, CA falsa, texto claro)
        run: |
          for modo in sem-certificado ca-falsa texto-claro; do
            docker compose --profile demo run --rm -T simulador --modo "$modo"
          done
      - name: logs em caso de falha
        if: failure()
        run: docker compose logs --tail 200 api nginx mosquitto ingestor

  publicar:
    name: 8 · publica e assina (GHCR + cosign)
    needs: [dast]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write }
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # nome de imagem precisa ser minusculo e o dono do repo e "Lynnbrosa"
      - name: nome da imagem
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/previopls-security" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: assina a imagem por digest (keyless, OIDC do GitHub)
        run: cosign sign --yes "${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"

  deploy:
    name: 9 · deploy (aprovacao manual)
    needs: [publicar]
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production # revisores obrigatorios configurados no GitHub
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: nome da imagem
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/previopls-security" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: so sobe imagem assinada por este workflow
        run: |
          cosign verify "${{ env.IMAGE }}@${{ needs.publicar.outputs.digest }}" \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/devsecops.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: aplica os manifests com o digest aprovado
        run: |
          cd infra/k8s
          kustomize edit set image "ghcr.io/lynnbrosa/previopls-security=${{ env.IMAGE }}@${{ needs.publicar.outputs.digest }}"
          kubectl apply -k . --server-side
