# broker de telemetria dos veiculos conectados
# so existe listener TLS com certificado de cliente: nao ha porta 1883 em texto claro

per_listener_settings false
allow_anonymous false
persistence false

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
# mTLS: sem certificado assinado pela CA interna nao passa do handshake
require_certificate true
# o CN do certificado vira o usuario, entao a ACL amarra topico ao VIN
use_identity_as_username true
# minimo TLS 1.2 (mosquitto 2.x trata tls_version como piso)
tls_version tlsv1.2

acl_file /mosquitto/config/acl

# limites contra flood de um device comprometido
max_packet_size 4096
max_inflight_messages 20
max_queued_messages 200
max_connections 1000
max_keepalive 300

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
